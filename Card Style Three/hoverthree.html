<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hover Expand Cards</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:black;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      gap: 10px;
      overflow: hidden;
    }

    .card {
      width: 60px;
      height: 350px;
      background: #fff;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .card:hover {
      width: 250px;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.3s ease;
      filter: brightness(0.8);
    }

    .card:hover img {
      filter: brightness(1);
    }

    .card .content {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 15px;
      background: rgba(255, 255, 255, 0.85);
      opacity: 0;
      transition: 0.4s ease;
      text-align: center;
    }

    .card:hover .content {
      opacity: 1;
    }

    .card .content h3 {
      margin: 0;
      font-size: 1.2rem;
      color: #d6336c;
    }

    .card .content p {
      margin-top: 5px;
      font-size: 0.9rem;
      color: #333;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <img src="hydrangea.jpg" alt="Hydrangeas">
    <div class="content">
      <h3>Hydrangeas</h3>
      <p>Soft, dreamy, and elegant blooms.</p>
    </div>
  </div>
  <div class="card">
    <img src="tulips.jpg" alt="Tulips">
    <div class="content">
      <h3>Tulips</h3>
      <p>Spring’s favorite chic statement flower.</p>
    </div>
  </div>
  <div class="card">
    <img src="peonies.jpg" alt="Peonies">
    <div class="content">
      <h3>Peonies</h3>
      <p>Full of fluff, charm, and elegance.</p>
    </div>
  </div>
</div>

</body>
</html>
